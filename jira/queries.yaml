# Reusable JQL patterns for agents.
# Results are always fetched live from Jira; never persist query results here.

projects:
  primary: [RAD, MYM]

queries:
  committed_work:
    description: Stories, Tasks and Bugs whose Fix Version is a delivery commitment (N/A and FREEZE excluded); the scope boundary for the AI Release Confidence experiment. Commitment rules are in standards/jira-conventions.md.
    jql: >
      project in (RAD, MYM)
      AND issuetype in (Story, Task, Bug)
      AND fixVersion is not EMPTY
      AND fixVersion not in ("N/A", "FREEZE")
      AND statusCategory != Done
      ORDER BY fixVersion ASC, priority DESC, key ASC

  oversized_or_unestimated_committed:
    description: Committed work with more than 5 Story Points or no estimate. Same scope as committed_work.
    jql: >
      project in (RAD, MYM)
      AND issuetype in (Story, Task, Bug)
      AND fixVersion is not EMPTY
      AND fixVersion not in ("N/A", "FREEZE")
      AND statusCategory != Done
      AND (cf[10021] > 5 OR cf[10021] is EMPTY)
      ORDER BY fixVersion ASC, priority DESC, key ASC

  empty_descriptions:
    description: Active Stories, Tasks and Bugs with an empty description.
    jql: >
      project in (RAD, MYM)
      AND issuetype in (Story, Task, Bug)
      AND statusCategory != Done
      AND description is EMPTY
      ORDER BY updated DESC

  missing_pr_field:
    description: Work at Code Review or later with an empty Pull Requests field.
    jql: >
      project in (RAD, MYM)
      AND issuetype in (Story, Task, Bug)
      AND status in ("CODE REVIEW", "IN CODE REVIEW", "In QA - HTD", "IN QA - MATHNASIUM", "IN PROGRESS - QA", "READY FOR STG", "READY FOR QA in STG", "READY FOR PROD")
      AND cf[11279] is EMPTY
      ORDER BY updated DESC

  placeholder_fix_versions:
    description: Active items whose Fix Version is a non-commitment placeholder (N/A or FREEZE). Review whether the placeholder is still right.
    jql: >
      project in (RAD, MYM)
      AND statusCategory != Done
      AND fixVersion in ("N/A", "FREEZE")
      ORDER BY fixVersion ASC, updated DESC

  watchlist_bugs:
    description: Active pre-commitment Bugs explicitly marked as Watchlist issues. These normally have no Fix Version and are reviewed for new evidence, reproduction, promotion to Confirmed issue, consolidation, or closure.
    jql: >
      project in (RAD, MYM)
      AND issuetype = Bug
      AND statusCategory != Done
      AND "Confirmed Issue" = "Watchlist issue"
      AND fixVersion is EMPTY
      ORDER BY priority DESC, updated DESC, key ASC

  watchlist_with_fix_version:
    description: Hygiene check for Bugs still marked Watchlist issue after a delivery commitment has been assigned. Review and normally promote them to Confirmed issue.
    jql: >
      project in (RAD, MYM)
      AND issuetype = Bug
      AND statusCategory != Done
      AND "Confirmed Issue" = "Watchlist issue"
      AND fixVersion is not EMPTY
      ORDER BY fixVersion ASC, priority DESC, key ASC

  active_epics:
    description: Active Epics across the primary product boards.
    jql: >
      project in (RAD, MYM)
      AND issuetype = Epic
      AND statusCategory != Done
      ORDER BY updated DESC

  stories_without_epic:
    description: Active Stories without a Jira parent Epic.
    jql: >
      project in (RAD, MYM)
      AND issuetype = Story
      AND parent is EMPTY
      AND statusCategory != Done
      ORDER BY updated DESC

  active_bugs:
    description: Active Bugs across the primary product boards.
    jql: >
      project in (RAD, MYM)
      AND issuetype = Bug
      AND statusCategory != Done
      ORDER BY updated DESC

  recently_created:
    description: Recent active work for intake/review.
    parameters: [created_since]
    template: >
      project in (RAD, MYM)
      AND statusCategory != Done
      AND created >= "{{created_since}}"
      ORDER BY created DESC

  release_scope:
    description: Work assigned to a specific project/version.
    parameters: [project, fix_version]
    template: >
      project = {{project}}
      AND fixVersion = "{{fix_version}}"
      ORDER BY issuetype ASC, priority DESC, key ASC

  initiative_children:
    description: Direct children of an Epic/parent.
    parameters: [parent_key]
    template: >
      parent = {{parent_key}}
      ORDER BY issuetype ASC, status ASC, priority DESC

  stale_active_work:
    description: Active work not updated since a caller-supplied date.
    parameters: [updated_before]
    template: >
      project in (RAD, MYM)
      AND statusCategory != Done
      AND updated < "{{updated_before}}"
      ORDER BY updated ASC
